<!DOCTYPE html>
<html lang="ar" dir="ltr" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alnafar | PS4 Exploit Host</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow:hidden}
  html,body{min-height:100vh;background:#080b1a;color:#e2e8f0;font:18px/1.6 'Noto Kufi Arabic','Chakra Petch','Segoe UI',system-ui,sans-serif}
  body{background:url('background.png') no-repeat center center;background-size:cover;background-attachment:fixed}

  #brand{text-align:center;padding:18px;background:rgba(8,11,26,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,212,255,.15)}
  #brand h1{font-size:28px;font-weight:700;letter-spacing:.15em;color:#e2e8f0;margin:0;text-shadow:0 0 25px rgba(0,212,255,.4)}
  #brand h1 span{color:#00d4ff}
  #brand small{display:block;font-size:14px;color:#6b7280;margin-top:4px;letter-spacing:.05em}

  #wrap{padding:20px 16px;max-width:520px;margin:0 auto}

  #msgs{font-size:26px;font-weight:700;margin:0 0 16px;text-align:center;line-height:1.4}
  #det{font-size:16px;color:#9ca3af;margin:0 0 10px;text-align:center;line-height:1.6}
  #det b{color:#e2e8f0;font-weight:600}
  #cache{font-size:14px;color:#6b7280;margin:0 0 16px;text-align:center;min-height:16px}
  #cache.cacheok{color:#34d399}
  .ok{color:#34d399}.bad{color:#f87171}.warn{color:#fbbf24}

  #logbox{margin-top:16px;padding:14px;border:1px solid rgba(0,212,255,.15);border-radius:8px;background:rgba(8,11,26,.75);backdrop-filter:blur(6px);max-height:200px;overflow-y:auto;font-size:18px;font-family:'Chakra Petch',monospace;color:#9ca3af;line-height:1.7}
  #logbox .ok{color:#34d399}
  #logbox .bad{color:#f87171}
  #logbox .warn{color:#fbbf24}
  #logbox .info{color:#60a5fa}

  .unsupported{
    margin-top:24px;padding:22px;border:1px solid rgba(0,212,255,.15);
    border-radius:10px;background:rgba(8,11,26,.75);backdrop-filter:blur(6px);text-align:center;
  }
  .unsupported h2{font-size:20px;color:#e2e8f0;margin:0 0 10px;font-weight:600}
  .unsupported p{font-size:16px;color:#9ca3af;line-height:1.7;margin:0}
  .unsupported .fw-list{margin-top:14px;text-align:left;font-size:14px;color:#6b7280;line-height:1.9}
  .unsupported .fw-list b{color:#9ca3af}

  .checkbox-wrap{margin-top:18px;text-align:center}
  .checkbox-wrap label{font-size:16px;color:#9ca3af;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .checkbox-wrap input[type="checkbox"]{width:18px;height:18px;accent-color:#00d4ff;cursor:pointer}

  #footer{text-align:center;padding:24px 16px;font-size:15px;color:#9ca3af;line-height:1.9;background:rgba(8,11,26,.6);backdrop-filter:blur(6px);margin-top:12px}
  #footer .store-name{font-size:24px;font-weight:700;color:#00d4ff;letter-spacing:.05em;margin-bottom:6px;text-shadow:0 0 15px rgba(0,212,255,.3)}
  #footer .store-addr{font-size:16px;color:#e2e8f0;line-height:1.8}
  #footer .store-phone{font-size:22px;font-weight:700;color:#34d399;letter-spacing:.08em;margin-top:8px;text-shadow:0 0 12px rgba(52,211,153,.3)}
  #footer a{color:#a78bfa;text-decoration:none;font-weight:600}
  #footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<h1 id="msgs" style="display:none"></h1>

<div id="brand">
  <h1><span>al</span>nafar</h1>
  <small>PS4 Exploit Host</small>
</div>

<div id="wrap">
  <div id="msgs2">جاري الفحص...</div>
  <div id="det"></div>
  <div id="cache"></div>
  <div id="动态"></div>
  <div id="logbox"></div>

  <div class="checkbox-wrap">
    <label>
      <input type="checkbox" id="autoRun" checked>
      تشغيل تلقائي عند الفتح
    </label>
  </div>
</div>

<div id="footer">
  <div class="store-name">الشاردة للإلكترونيات</div>
  <div class="store-addr">شارع القضائية مقابل مطحنة الفضيل — جوار معهد البيان — أجدابيا</div>
  <div class="store-phone">0920595447</div>
  <br>
  <a href="https://github.com/CODE-NAME-IN-B">CODE-NAME-IN-B</a>
</div>

<script>
(function(){
  'use strict';

  // Global msgs element for exploit scripts (lapse.js etc.)
  var msgsEl=document.getElementById('msgs');
  // Also expose as global for scripts that reference it directly
  window.msgs=msgsEl;
  window.msgs2=document.getElementById('msgs2');

  var logEl=document.getElementById('logbox');

  function logMsg(msg,type){
    var c=type||'info';
    logEl.innerHTML+='<span class="'+c+'">'+msg+'</span>\n';
    logEl.scrollTop=logEl.scrollHeight;
  }

  logMsg('[alnafar] host initialized','info');

  var ROUTES=[
    {key_min:700,key_max:852,label:'7.00-8.52',script:'g2all/700/alert.js',module:true},
    {key_min:900,key_max:960,label:'9.00-9.60',script:'g2all/900/alert.js',module:true},
    {key_min:1000,key_max:1102,label:'10.00-11.02',script:'g2all/css/main.js',module:false,invoke:'doJb'},
    {key_min:1150,key_max:1202,label:'11.50-12.02',script:'g2all/slopkit/chain_lapse.js',module:true},
    {key_min:1250,key_max:1300,label:'12.50-13.00',script:'g2all/slopkit/chain_poops.js',module:true}
  ];

  var stateEl=document.getElementById('msgs2');
  var detEl=document.getElementById('det');
  var cacheEl=document.getElementById('cache');
  var infoEl=document.getElementById('动态');

  function setState(t,c){stateEl.textContent=t;stateEl.className=c||'';msgsEl.textContent=t;msgsEl.className=c||''}
  function setCache(t,ok){cacheEl.textContent=t;cacheEl.className=ok?'cacheok':''}

  var params=new URLSearchParams(location.search);

  var key=null,fwnum=null,route=null;
  var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

  if(m){
    var major=parseInt(m[1],10);
    var minor=parseInt(m[2],16);
    var ms=minor.toString(16);
    if(ms.length<2) ms='0'+ms;
    key=m[1]+'.'+ms;
    fwnum=major*100+parseInt(ms,10);
    logMsg('[detect] firmware: '+key+' ('+fwnum+')','info');
  }

  function findRoute(fw){
    for(var i=0;i<ROUTES.length;i++){
      if(fw>=ROUTES[i].key_min&&fw<=ROUTES[i].key_max) return ROUTES[i];
    }
    return null;
  }

  var forced=params.get('bug');
  if(forced==='lapse'||forced==='poops'){
    route={script:forced==='lapse'?'g2all/slopkit/chain_lapse.js':'g2all/slopkit/chain_poops.js',module:true,label:forced};
    detEl.innerHTML='firmware <b>'+key+'</b> &middot; chain <b>'+forced+'</b> &middot; forced';
    logMsg('[route] forced chain: '+forced,'warn');
  }else if(!key){
    setState('','');
    detEl.innerHTML='';
    logMsg('[error] not a PS4 — showing info page','warn');
    infoEl.innerHTML='<div class="unsupported">'+
      '<h2>هذه الصفحة مخصصة لجهاز PlayStation 4</h2>'+
      '<p>افتح هذا الرابط من متصفح PS4 على جهازك.</p>'+
      '<div class="fw-list">'+
        '<b>الفيرموير المدعوم:</b><br>'+
        '7.00 - 8.52 &middot; 9.00 - 9.60 &middot; 10.00 - 11.02<br>'+
        '11.50 - 12.02 &middot; 12.50 - 13.00'+
      '</div>'+
    '</div>';
    return;
  }else{
    route=findRoute(fwnum);
    if(route){
      detEl.innerHTML='firmware <b>'+key+'</b> &middot; chain <b>'+route.label+'</b>';
      logMsg('[route] found: '+route.label+' → '+route.script,'ok');
    }else{
      setState('','');
      detEl.innerHTML='';
      logMsg('[error] firmware '+key+' not supported','bad');
      infoEl.innerHTML='<div class="unsupported">'+
        '<h2>الفيرموير '+key+' غير مدعوم بعد</h2>'+
        '<p>لا يوجد exploit متاح لهذه الإصدارة.</p>'+
        '<div class="fw-list">'+
          '<b>الفيرموير المدعوم:</b><br>'+
          '7.00 - 8.52 &middot; 9.00 - 9.60 &middot; 10.00 - 11.02<br>'+
          '11.50 - 12.02 &middot; 12.50 - 13.00'+
        '</div>'+
      '</div>';
      return;
    }
  }

  // Auto-run checkbox
  var autoRun=document.getElementById('autoRun');
  var autoRunKey='alnafar_autorun';
  var saved=localStorage.getItem(autoRunKey);
  if(saved!==null) autoRun.checked=saved==='true';
  autoRun.addEventListener('change',function(){
    localStorage.setItem(autoRunKey,autoRun.checked);
    logMsg('[settings] auto-run: '+(autoRun.checked?'enabled':'disabled'),'info');
  });
  logMsg('[settings] auto-run: '+(autoRun.checked?'enabled':'disabled'),'info');

  // Exploit chain
  var running=false;
  function loadScript(rt,attempt){
    attempt=attempt||1;
    if(running) return;

    if(!autoRun.checked){
      setState('جاهز — اضغط للتشغيل','ok');
      logMsg('[wait] auto-run disabled, waiting for tap','info');
      function fire(){
        document.removeEventListener('click',fire);
        document.removeEventListener('keydown',fire);
        running=true;
        setState('loading '+rt.label+'...','warn');
        logMsg('[exploit] starting chain: '+rt.label,'warn');
        doLoad(rt,1);
      }
      document.addEventListener('click',fire);
      document.addEventListener('keydown',fire);
      return;
    }

    running=true;
    setState('loading '+rt.label+'...','warn');
    logMsg('[exploit] starting chain: '+rt.label,'warn');
    doLoad(rt,attempt);
  }

  function doLoad(rt,attempt){
    var s=document.createElement('script');
    s.async=false;s.src=rt.script;
    if(rt.module) s.type='module';
    s.onload=function(){
      setState('chain ready','ok');
      logMsg('[exploit] script loaded: '+rt.script,'ok');
      if(rt.invoke&&typeof window[rt.invoke]==='function') window[rt.invoke]();
    };
    s.onerror=function(){
      s.remove();
      if(attempt<3){
        setCache('retrying ('+attempt+'/3)...');
        logMsg('[error] load failed, retry '+attempt+'/3','bad');
        setTimeout(function(){doLoad(rt,attempt+1)},attempt*900);
      }else{
        setState('failed','bad');
        logMsg('[error] could not load '+rt.script,'bad');
        setCache('could not load exploit. clear cache and reload.');
      }
    };
    document.head.appendChild(s);
  }

  function waitForTap(msg,action){
    setState(msg,'warn');
    logMsg('[tap] '+msg,'warn');
    function fire(){
      document.removeEventListener('click',fire);
      document.removeEventListener('keydown',fire);
      action();
    }
    document.addEventListener('click',fire);
    document.addEventListener('keydown',fire);
  }

  function go(){loadScript(route)}

  // Cache
  var ac=window.applicationCache;
  if(!ac||!document.documentElement.hasAttribute('manifest')){
    logMsg('[cache] no manifest, running directly','info');
    go();
  }else if(!navigator.onLine){
    setCache('offline mode',true);
    logMsg('[cache] offline, using cache','info');
    go();
  }else if(ac.status===ac.IDLE){
    setCache('cached',true);
    logMsg('[cache] already cached','ok');
    go();
  }else if(ac.status===ac.UPDATEREADY){
    try{ac.swapCache()}catch(e){}
    setCache('update ready',true);
    logMsg('[cache] update downloaded','ok');
    waitForTap('UPDATE READY — tap or press X to reload',function(){location.reload()});
  }else{
    setCache('checking cache...');
    logMsg('[cache] checking...','info');
    ac.addEventListener('downloading',function(){
      setCache('downloading for offline use...');
      logMsg('[cache] downloading...','info');
    },false);
    ac.addEventListener('progress',function(e){
      if(e&&e.total){
        var p=Math.round((e.loaded/e.total)*100);
        setCache(p+'%');
      }
    },false);
    ac.addEventListener('cached',function(){
      setCache('cached',true);
      logMsg('[cache] cached successfully','ok');
      setState('جاري التشغيل...','ok');
      go();
    },false);
    ac.addEventListener('updateready',function(){
      try{ac.swapCache()}catch(e){}
      setCache('update ready',true);
      logMsg('[cache] update ready','ok');
      waitForTap('UPDATE READY — tap or press X to reload',function(){location.reload()});
    },false);
    ac.addEventListener('noupdate',function(){
      setCache('cached',true);
      logMsg('[cache] no update','ok');
      go();
    },false);
    ac.addEventListener('error',function(){
      setCache('cache unavailable');
      logMsg('[cache] error','bad');
      waitForTap('tap to run anyway',go);
    },false);
    ac.addEventListener('obsolete',function(){
      setCache('cache obsolete');
      logMsg('[cache] obsolete','warn');
      waitForTap('tap to run',go);
    },false);
  }
})();
</script>
</body>
</html>

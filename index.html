<!DOCTYPE html>
<html lang="ar" dir="ltr" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alnafar | PS4 Exploit Host</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;width:100%;overflow:hidden;
    background:#080b1a;color:#e2e8f0;
    font-family:'Noto Kufi Arabic','Chakra Petch','Segoe UI',system-ui,sans-serif;
  }
  body{
    background:url('background.png') no-repeat center center;
    background-size:cover;background-attachment:fixed;
    display:flex;flex-direction:column;
  }

  /* Header */
  #brand{
    flex:0 0 auto;
    text-align:center;padding:2.5vh 16px;
    background:rgba(8,11,26,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(0,212,255,.15);
  }
  #brand h1{
    font-size:clamp(24px,4.5vw,50px);font-weight:700;
    letter-spacing:.15em;color:#e2e8f0;margin:0;
    text-shadow:0 0 25px rgba(0,212,255,.4);
  }
  #brand h1 span{color:#00d4ff}
  #brand small{
    display:block;font-size:clamp(12px,2vw,20px);
    color:#6b7280;margin-top:4px;letter-spacing:.05em;
  }

  /* Main content — centered vertically */
  #main{
    flex:1 1 auto;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:2vh 20px;
    max-width:900px;width:100%;margin:0 auto;
  }

  #msgs{
    font-size:clamp(28px,5vw,50px);font-weight:700;
    text-align:center;line-height:1.5;
    text-shadow:0.1em 0.1em 0.2em black;
    margin:0 0 3vh;
  }
  .ok{color:#34d399}.bad{color:#f87171}.warn{color:#fbbf24}

  /* Log box */
  #logbox{
    width:100%;max-width:700px;
    padding:16px 20px;
    border:1px solid rgba(0,212,255,.15);border-radius:10px;
    background:rgba(8,11,26,.75);backdrop-filter:blur(6px);
    max-height:20vh;overflow-y:auto;
    font-size:clamp(14px,2.2vw,22px);
    font-family:'Chakra Petch',monospace;
    color:#9ca3af;line-height:1.7;
    margin-bottom:2vh;
  }
  #logbox .ok{color:#34d399}#logbox .bad{color:#f87171}#logbox .warn{color:#fbbf24}#logbox .info{color:#60a5fa}

  /* Unsupported box */
  .unsupported{
    width:100%;max-width:700px;
    padding:24px;border:1px solid rgba(0,212,255,.15);
    border-radius:12px;background:rgba(8,11,26,.75);backdrop-filter:blur(6px);
    text-align:center;
  }
  .unsupported h2{font-size:clamp(18px,3vw,30px);color:#e2e8f0;margin:0 0 10px;font-weight:600}
  .unsupported p{font-size:clamp(14px,2.2vw,22px);color:#9ca3af;line-height:1.7;margin:0}
  .unsupported .fw-list{margin-top:14px;text-align:left;font-size:clamp(12px,2vw,18px);color:#6b7280;line-height:1.9}
  .unsupported .fw-list b{color:#9ca3af}

  /* Checkbox */
  .checkbox-wrap{margin-top:2vh;text-align:center}
  .checkbox-wrap label{
    font-size:clamp(14px,2.2vw,22px);color:#9ca3af;cursor:pointer;
    display:inline-flex;align-items:center;gap:10px;
  }
  .checkbox-wrap input[type="checkbox"]{
    width:clamp(18px,2.5vw,28px);height:clamp(18px,2.5vw,28px);
    accent-color:#00d4ff;cursor:pointer;
  }

  /* Footer */
  #footer{
    flex:0 0 auto;text-align:center;
    padding:2vh 16px;
    font-size:clamp(13px,2vw,18px);color:#9ca3af;line-height:1.9;
    background:rgba(8,11,26,.6);backdrop-filter:blur(6px);
  }
  #footer .store-name{
    font-size:clamp(20px,3.5vw,36px);font-weight:700;color:#00d4ff;
    letter-spacing:.05em;margin-bottom:6px;
    text-shadow:0 0 15px rgba(0,212,255,.3);
  }
  #footer .store-addr{font-size:clamp(14px,2.2vw,22px);color:#e2e8f0;line-height:1.8}
  #footer .store-phone{
    font-size:clamp(18px,3vw,32px);font-weight:700;color:#34d399;
    letter-spacing:.08em;margin-top:8px;
    text-shadow:0 0 12px rgba(52,211,153,.3);
  }
  #footer a{color:#a78bfa;text-decoration:none;font-weight:600}
  #footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<div id="brand">
  <h1><span>al</span>nafar</h1>
  <small>PS4 Exploit Host</small>
</div>

<div id="main">
  <h1 id="msgs">جاري الفحص...</h1>
  <div id="logbox"></div>
  <div id="动态"></div>

  <div class="checkbox-wrap">
    <label>
      <input type="checkbox" id="autoRun" checked>
      تشغيل تلقائي عند الفتح
    </label>
  </div>
</div>

<div id="footer">
  <div class="store-name">الشاردة للإلكترونيات</div>
  <div class="store-addr">شارع القضائية مقابل مطحنة الفضيل — جوار معهد البيان — أجدابيا</div>
  <div class="store-phone">0920595447</div>
  <br>
  <a href="https://github.com/CODE-NAME-IN-B">CODE-NAME-IN-B</a>
</div>

<script>
(function(){
  'use strict';

  var msgsEl=document.getElementById('msgs');
  window.msgs=msgsEl;

  var logEl=document.getElementById('logbox');
  var infoEl=document.getElementById('动态');
  function logMsg(msg,type){
    logEl.innerHTML+='<span class="'+(type||'info')+'">'+msg+'</span>\n';
    logEl.scrollTop=logEl.scrollHeight;
  }

  logMsg('[alnafar] host initialized','info');

  var ROUTES=[
    {key_min:700,key_max:852,label:'7.00-8.52',script:'g2all/700/alert.js',module:true},
    {key_min:900,key_max:960,label:'9.00-9.60',script:'g2all/900/alert.js',module:true},
    {key_min:1000,key_max:1102,label:'10.00-11.02',script:'g2all/css/main.js',module:false,invoke:'doJb'},
    {key_min:1150,key_max:1202,label:'11.50-12.02',script:'g2all/slopkit/chain_lapse.js',module:true},
    {key_min:1250,key_max:1300,label:'12.50-13.00',script:'g2all/slopkit/chain_poops.js',module:true}
  ];

  function setState(t,c){msgsEl.textContent=t;msgsEl.className=c||''}

  var params=new URLSearchParams(location.search);

  var key=null,fwnum=null,route=null;
  var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

  if(m){
    var major=parseInt(m[1],10);
    var minor=parseInt(m[2],16);
    var ms=minor.toString(16);
    if(ms.length<2) ms='0'+ms;
    key=m[1]+'.'+ms;
    fwnum=major*100+parseInt(ms,10);
    logMsg('[detect] firmware: '+key+' ('+fwnum+')','info');
  }

  function findRoute(fw){
    for(var i=0;i<ROUTES.length;i++){
      if(fw>=ROUTES[i].key_min&&fw<=ROUTES[i].key_max) return ROUTES[i];
    }
    return null;
  }

  var forced=params.get('bug');
  if(forced==='lapse'||forced==='poops'){
    route={script:forced==='lapse'?'g2all/slopkit/chain_lapse.js':'g2all/slopkit/chain_poops.js',module:true,label:forced};
    logMsg('[route] forced chain: '+forced,'warn');
  }else if(!key){
    msgsEl.innerHTML='<span class="bad">هذه الصفحة مخصصة لجهاز PlayStation 4</span>';
    logMsg('[error] not a PS4','warn');
    return;
  }else{
    route=findRoute(fwnum);
    if(route){
      logMsg('[route] found: '+route.label+' → '+route.script,'ok');
    }else{
      msgsEl.innerHTML='<span class="bad">الفيرموير '+key+' غير مدعوم بعد</span>';
      logMsg('[error] firmware not supported','bad');
      return;
    }
  }

  var autoRun=document.getElementById('autoRun');
  var autoRunKey='alnafar_autorun';
  var saved=localStorage.getItem(autoRunKey);
  if(saved!==null) autoRun.checked=saved==='true';
  autoRun.addEventListener('change',function(){
    localStorage.setItem(autoRunKey,autoRun.checked);
    logMsg('[settings] auto-run: '+(autoRun.checked?'enabled':'disabled'),'info');
  });
  logMsg('[settings] auto-run: '+(autoRun.checked?'enabled':'disabled'),'info');

  var running=false;
  function loadScript(rt,attempt){
    attempt=attempt||1;
    if(running) return;

    if(!autoRun.checked){
      setState('جاهز — اضغط للتشغيل','ok');
      logMsg('[wait] auto-run disabled, waiting for tap','info');
      function fire(){
        document.removeEventListener('click',fire);
        document.removeEventListener('keydown',fire);
        running=true;
        setState('جاري تحميل '+rt.label+'...','warn');
        logMsg('[exploit] starting chain: '+rt.label,'warn');
        doLoad(rt,1);
      }
      document.addEventListener('click',fire);
      document.addEventListener('keydown',fire);
      return;
    }

    running=true;
    setState('جاري تحميل '+rt.label+'...','warn');
    logMsg('[exploit] starting chain: '+rt.label,'warn');
    doLoad(rt,attempt);
  }

  function doLoad(rt,attempt){
    var s=document.createElement('script');
    s.async=false;s.src=rt.script;
    if(rt.module) s.type='module';
    s.onload=function(){
      logMsg('[exploit] script loaded: '+rt.script,'ok');
      if(rt.invoke&&typeof window[rt.invoke]==='function') window[rt.invoke]();
    };
    s.onerror=function(){
      s.remove();
      if(attempt<3){
        logMsg('[error] load failed, retry '+attempt+'/3','bad');
        setTimeout(function(){doLoad(rt,attempt+1)},attempt*900);
      }else{
        setState('فشل — أعد تشغيل الجهاز','bad');
        logMsg('[error] could not load '+rt.script,'bad');
      }
    };
    document.head.appendChild(s);
  }

  function go(){loadScript(route)}

  var ac=window.applicationCache;
  if(!ac||!document.documentElement.hasAttribute('manifest')){
    logMsg('[cache] no manifest, running directly','info');
    go();
  }else if(!navigator.onLine){
    logMsg('[cache] offline, using cache','info');
    go();
  }else if(ac.status===ac.IDLE){
    logMsg('[cache] already cached','ok');
    go();
  }else if(ac.status===ac.UPDATEREADY){
    try{ac.swapCache()}catch(e){}
    logMsg('[cache] update downloaded','ok');
    go();
  }else{
    logMsg('[cache] checking...','info');
    ac.addEventListener('downloading',function(){
      msgsEl.innerHTML='جاري تحميل الكاش...';
      logMsg('[cache] downloading...','info');
    },false);
    ac.addEventListener('progress',function(e){
      if(e&&e.total){
        var p=Math.round((e.loaded/e.total)*100);
        msgsEl.innerHTML='جاري تحميل الكاش... '+p+'%';
      }
    },false);
    ac.addEventListener('cached',function(){
      msgsEl.innerHTML='تم التخزين — جاري التشغيل...';
      logMsg('[cache] cached successfully','ok');
      go();
    },false);
    ac.addEventListener('updateready',function(){
      try{ac.swapCache()}catch(e){}
      logMsg('[cache] update ready','ok');
      go();
    },false);
    ac.addEventListener('noupdate',function(){
      logMsg('[cache] no update','ok');
      go();
    },false);
    ac.addEventListener('error',function(){
      msgsEl.innerHTML='خطأ في الكاش';
      logMsg('[cache] error','bad');
      go();
    },false);
    ac.addEventListener('obsolete',function(){
      logMsg('[cache] obsolete','warn');
      go();
    },false);
  }
})();
</script>
</body>
</html>

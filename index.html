<style>

  /* Glitch Animation */
  @keyframes glitch{
    0%,100%{transform:translate(0)}

    40%{transform:translate(-2px,-2px)}
    60%{transform:translate(2px,2px)}

  #brand h1:hover{animation:glitch .3s ease-in-out}

  /* Main content */
  #main{
    flex:1 1 auto;

  #msgs{

  .ok{color:#34d399;text-shadow:0 0 10px rgba(52,211,153,.5)}

  .warn{color:#F59E0B;text-shadow:0 0 10px rgba(245,158,11,.5)}

  /* Log box */
  #logbox{
    width:100%;max-width:600px;

    margin-bottom:clamp(10px,1.5vh,16px);
    box-shadow:0 0 15px rgba(124,58,237,.1),inset 0 0 30px rgba(0,0,0,.3);
  }
  #logbox{scrollbar-width:none;-ms-overflow-style:none}
  #logbox::-webkit-scrollbar{display:none}
  #logbox .ok{color:#4ade80}#logbox .bad{color:#FB7185}#logbox .warn{color:#FCD34D}#logbox .info{color:#A5B4FC}

  /* Unsupported box */
  .unsupported{
    width:100%;max-width:600px;
    padding:clamp(16px,2vw,24px);border:1px solid rgba(124,58,237,.2);
    border-radius:12px;background:rgba(15,15,35,.85);backdrop-filter:blur(8px);
    text-align:center;
    box-shadow:0 0 20px rgba(124,58,237,.15);
  }
  .unsupported h2{font-size:clamp(16px,2.5vw,24px);color:#e2e8f0;margin:0 0 10px;font-weight:600}
  .unsupported p{font-size:clamp(13px,1.8vw,18px);color:#9ca3af;line-height:1.7;margin:0}
  .unsupported .fw-list{margin-top:12px;text-align:left;font-size:clamp(12px,1.5vw,16px);color:#94a3b8;line-height:1.9}
  .unsupported .fw-list b{color:#e2e8f0}

  /* Checkbox */
  .checkbox-wrap{margin-top:clamp(10px,1.5vh,16px);text-align:center}
  .checkbox-wrap label{
    font-size:clamp(13px,1.8vw,18px);color:#e2e8f0;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    padding:clamp(6px,1vw,10px) clamp(12px,1.5vw,18px);border-radius:8px;
    border:1px solid rgba(124,58,237,.3);
    background:rgba(15,15,35,.6);
    transition:all .2s ease;
  }
  .checkbox-wrap label:hover{
    border-color:rgba(124,58,237,.6);
    background:rgba(124,58,237,.15);
  }
  .checkbox-wrap input[type="checkbox"]{
    width:clamp(16px,2vw,22px);height:clamp(16px,2vw,22px);
    accent-color:#7C3AED;cursor:pointer;
  }

  /* Footer */
  #footer{
    flex:0 0 auto;text-align:center;
    padding:clamp(6px,1vh,10px) clamp(8px,1vw,12px);
    font-size:clamp(11px,1.2vw,14px);color:#e2e8f0;line-height:1.6;
    background:rgba(15,15,35,.4);backdrop-filter:blur(4px);
    border-top:1px solid rgba(124,58,237,.15);
  }
  #footer .store-name{
    font-family:'Russo One','Chakra Petch',sans-serif;
    font-size:clamp(14px,1.8vw,20px);font-weight:700;
    letter-spacing:.03em;margin-bottom:2px;
    background:linear-gradient(135deg,#7C3AED,#F43F5E,#7C3AED);
    background-size:200% 200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:gradientShift 3s ease infinite;
    text-shadow:none;
    filter:drop-shadow(0 0 6px rgba(124,58,237,.4));
  }
  @keyframes gradientShift{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }
  #footer .store-addr{font-size:clamp(10px,1.2vw,14px);color:#f1f5f9;line-height:1.5}
  #footer .store-phone{
    font-family:'Russo One','Chakra Petch',sans-serif;
    font-size:clamp(12px,1.5vw,18px);font-weight:700;color:#34d399;
    letter-spacing:.06em;margin-top:2px;
    text-shadow:0 0 8px rgba(52,211,153,.4);
  }
  #footer a{
    color:#C4B5FD;text-decoration:none;font-weight:600;
    transition:all .2s ease;font-size:clamp(10px,1.2vw,14px);
  }
  #footer a:hover{
    color:#F43F5E;text-decoration:none;
    text-shadow:0 0 8px rgba(244,63,94,.5);
  }

  /* Progress Bar (for cache loading) */
  .progress-wrap{
    width:100%;max-width:300px;height:4px;
    background:rgba(124,58,237,.15);border-radius:4px;
    margin:16px auto;overflow:hidden;display:none;
  }
  .progress-fill{
    height:100%;width:0;
    background:linear-gradient(90deg,#7C3AED,#F43F5E,#7C3AED);
    background-size:200% 100%;
    border-radius:4px;
    animation:shimmer 1.5s linear infinite;
    transition:width .3s ease;
  }
  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }

<body>

<div id="brand">
  <h1><span>al</span>nafar</h1>
  <small>PS4 Exploit Host</small>
</div>

<div id="main">
  <h1 id="msgs">جاري الفحص...</h1>
  <div id="logbox"></div>
  <div id="动态"></div>

  <div class="checkbox-wrap">
    <label>
      <input type="checkbox" id="autoRun" checked>
      تشغيل تلقائي عند الفتح
    </label>
  </div>
</div>

<div id="footer">
  <div class="store-name">الشاردة للإلكترونيات</div>
  <div class="store-addr">شارع القضائية مقابل مطحنة الفضيل — جوار معهد البيان — أجدابيا</div>
  <div class="store-phone">0920595447</div>
  <br>
  <a href="https://github.com/CODE-NAME-IN-B">CODE-NAME-IN-B</a>
</div>

<script>
(function(){
  'use strict';

  var msgsEl=document.getElementById('msgs');
  window.msgs=msgsEl;

  var logEl=document.getElementById('logbox');
  var infoEl=document.getElementById('动态');
  function logMsg(msg,type){
    logEl.innerHTML+='<span class="'+(type||'info')+'">'+msg+'</span>\n';
    logEl.scrollTop=logEl.scrollHeight;
  }

  logMsg('[alnafar] host initialized','info');

  var ROUTES=[
    {key_min:700,key_max:852,label:'7.00-8.52',script:'g2all/700/alert.js',module:true},
    {key_min:900,key_max:960,label:'9.00-9.60',script:'g2all/900/alert.js',module:true},
    {key_min:1000,key_max:1300,label:'10.00-13.00',redirect:'g2all/index.html'}
  ];

  function setState(t,c){msgsEl.textContent=t;msgsEl.className=c||''}

  var params=new URLSearchParams(location.search);

  var key=null,fwnum=null,route=null;
  var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

  if(m){
    var major=parseInt(m[1],10);
    var minor=parseInt(m[2],16);
    var ms=minor.toString(16);
    if(ms.length<2) ms='0'+ms;
    key=m[1]+'.'+ms;
    fwnum=major*100+parseInt(ms,10);
    logMsg('[detect] firmware: '+key+' ('+fwnum+')','info');
  }

  function findRoute(fw){
    for(var i=0;i<ROUTES.length;i++){
      if(fw>=ROUTES[i].key_min&&fw<=ROUTES[i].key_max) return ROUTES[i];
    }
    return null;
  }

  var forced=params.get('bug');
  if(forced==='lapse'||forced==='poops'){
    route={script:forced==='lapse'?'g2all/slopkit/chain_lapse.js':'g2all/slopkit/chain_poops.js',module:true,label:forced};
    logMsg('[route] forced chain: '+forced,'warn');
  }else if(!key){
    msgsEl.innerHTML='<span class="bad">هذه الصفحة مخصصة لجهاز PlayStation 4</span>';
    logMsg('[error] not a PS4','warn');
    return;
  }else{
    route=findRoute(fwnum);
    if(route){
      logMsg('[route] found: '+route.label,'ok');
    }else{
      msgsEl.innerHTML='<span class="bad">الفيرموير '+key+' غير مدعوم بعد</span>';
      logMsg('[error] firmware not supported','bad');
      return;
    }
  }

  if(route.redirect){
    logMsg('[route] redirecting to: '+route.redirect,'ok');
    window.location.href=route.redirect;
    return;
  }

  var autoRun=document.getElementById('autoRun');
  var autoRunKey='alnafar_autorun';
  var saved=localStorage.getItem(autoRunKey);
  if(saved!==null) autoRun.checked=saved==='true';
  autoRun.addEventListener('change',function(){
    localStorage.setItem(autoRunKey,autoRun.checked);
    logMsg('[settings] auto-run: '+(autoRun.checked?'enabled':'disabled'),'info');
  });
  logMsg('[settings] auto-run: '+(autoRun.checked?'enabled':'disabled'),'info');

  var running=false;
  function loadScript(rt,attempt){
    attempt=attempt||1;
    if(running) return;

    if(!autoRun.checked){
      setState('جاهز — اضغط للتشغيل','ok');
      logMsg('[wait] auto-run disabled, waiting for tap','info');
      function fire(){
        document.removeEventListener('click',fire);
        document.removeEventListener('keydown',fire);
        running=true;
        setState('جاري تحميل '+rt.label+'...','warn');
        logMsg('[exploit] starting chain: '+rt.label,'warn');
        doLoad(rt,1);
      }
      document.addEventListener('click',fire);
      document.addEventListener('keydown',fire);
      return;
    }

    running=true;
    setState('جاري تحميل '+rt.label+'...','warn');
    logMsg('[exploit] starting chain: '+rt.label,'warn');
    doLoad(rt,attempt);
  }

  function doLoad(rt,attempt){
    var s=document.createElement('script');
    s.async=false;s.src=rt.script;
    if(rt.module) s.type='module';
    s.onload=function(){
      logMsg('[exploit] script loaded: '+rt.script,'ok');
      if(rt.invoke&&typeof window[rt.invoke]==='function') window[rt.invoke]();
    };
    s.onerror=function(){
      s.remove();
      if(attempt<3){
        logMsg('[error] load failed, retry '+attempt+'/3','bad');
        setTimeout(function(){doLoad(rt,attempt+1)},attempt*900);
      }else{
        setState('فشل — أعد تشغيل الجهاز','bad');
        logMsg('[error] could not load '+rt.script,'bad');
      }
    };
    document.head.appendChild(s);
  }

  function go(){loadScript(route)}

  var ac=window.applicationCache;
  if(!ac||!document.documentElement.hasAttribute('manifest')){
    logMsg('[cache] no manifest, running directly','info');
    go();
  }else if(!navigator.onLine){
    logMsg('[cache] offline, using cache','info');
    go();
  }else if(ac.status===ac.IDLE){
    logMsg('[cache] already cached','ok');
    go();
  }else if(ac.status===ac.UPDATEREADY){
    try{ac.swapCache()}catch(e){}
    logMsg('[cache] update downloaded','ok');
    go();
  }else{
    logMsg('[cache] checking...','info');
    ac.addEventListener('downloading',function(){
      msgsEl.innerHTML='جاري تحميل الكاش...';
      logMsg('[cache] downloading...','info');
    },false);
    ac.addEventListener('progress',function(e){
      if(e&&e.total){
        var p=Math.round((e.loaded/e.total)*100);
        msgsEl.innerHTML='جاري تحميل الكاش... '+p+'%';
      }
    },false);
    ac.addEventListener('cached',function(){
      msgsEl.innerHTML='تم التخزين — جاري التشغيل...';
      logMsg('[cache] cached successfully','ok');
      go();
    },false);
    ac.addEventListener('updateready',function(){
      try{ac.swapCache()}catch(e){}
      logMsg('[cache] update ready','ok');
      go();
    },false);
    ac.addEventListener('noupdate',function(){
      logMsg('[cache] no update','ok');
      go();
    },false);
    ac.addEventListener('error',function(){
      msgsEl.innerHTML='خطأ في الكاش';
      logMsg('[cache] error','bad');
      go();
    },false);
    ac.addEventListener('obsolete',function(){
      logMsg('[cache] obsolete','warn');
      go();
    },false);
  }
})();
</script>

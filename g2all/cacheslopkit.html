<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="slopkit.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alnafar | Cache 11.50-13.52</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="brand">
  <h1><span>al</span>nafar</h1>
  <small>PS4 Exploit Host</small>
</div>

<div id="main">
  <h1 id="msgs" role="status" aria-live="polite">جاري فحص الكاش...</h1>
  <div class="progress-wrap" id="progWrap"><div class="progress-fill" id="progFill"></div></div>
  <div class="fw-badge">firmware 11.50-13.52</div>
</div>

<div id="footer">
  <div class="store-name">الشاردة للإلكترونيات</div>
  <div class="store-addr">شارع القضائية مقابل مطحنة الفضيل — جوار معهد البيان — أجدابيا</div>
  <div class="store-phone">0920595447</div>
</div>

<script>
history.replaceState(null,null,'index.html');
var histlength=history.length;
history.go(-histlength);

var msgsEl=document.getElementById('msgs');
var progWrap=document.getElementById('progWrap');
var progFill=document.getElementById('progFill');

function DLProgress(e){
  if(!e.total) return;
  var p=Math.round(e.loaded/e.total*100);
  msgsEl.innerHTML='جاري التحميل... '+p+'%';
  msgsEl.className='warn';
  progWrap.style.display='block';
  progFill.style.width=p+'%';
}
function DisplayCacheProgress(){
  msgsEl.innerHTML='تم التخزين بنجاح';
  msgsEl.className='ok';
  progWrap.style.display='block';
  progFill.style.width='100%';
  setTimeout(function(){msgsEl.innerHTML='أغلق وأعد فتح المتصفح...';},2000);
}
window.applicationCache.addEventListener('progress',DLProgress,false);
window.applicationCache.oncached=function(){DisplayCacheProgress()};
window.applicationCache.onupdateready=function(){DisplayCacheProgress()};
window.applicationCache.onerror=function(){
  msgsEl.innerHTML='خطأ في الكاش — امسح البيانات وأعد التثبيت';
  msgsEl.className='bad';
  msgsEl.setAttribute('role','alert');
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alnafar | GoldHEN</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="brand">
  <h1><span>al</span>nafar</h1>
  <small>PS4 Exploit Host</small>
</div>

<div id="main">
  <h1 id="msgs">جاري تحميل GoldHEN v2.4b18.12... انتظر</h1>
  <div class="progress-wrap" id="progWrap"><div class="progress-fill" id="progFill"></div></div>
</div>

<div id="footer">
  <div class="store-name">الشاردة للإلكترونيات</div>
  <div class="store-addr">شارع القضائية مقابل مطحنة الفضيل — جوار معهد البيان — أجدابيا</div>
  <div class="store-phone">0920595447</div>
</div>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

var msgsEl = document.getElementById("msgs");
var progWrap = document.getElementById("progWrap");
var progFill = document.getElementById("progFill");

function setState(t, c) { msgsEl.innerHTML = t; msgsEl.className = c || ""; }
function setProgress(p) {
  if (!progWrap) return;
  progWrap.style.display = "block";
  progFill.style.width = Math.max(0, Math.min(100, p)) + "%";
}
function onScriptError() {
  setState("محتوى غير موجود — امسح بيانات المتصفح وأعد تثبيت الكاش", "bad");
}

var params = new URLSearchParams(location.search);
var forced = params.get("bug");

function loadScript(src, isModule, onload) {
  var script = document.createElement("script");
  if (isModule) script.type = "module";
  script.src = src;
  script.onerror = onScriptError;
  if (onload) script.onload = onload;
  document.head.appendChild(script);
}

function redirectToCache() {
  if (fwNum >= 5.05 && fwNum <= 5.07) {
    window.location.replace("cache505.html");
  } else if (fwNum >= 7.00 && fwNum <= 8.52) {
    window.location.replace("cache700.html");
  } else if (fwNum >= 9.00 && fwNum <= 9.60) {
    window.location.replace("cache900.html");
  } else if (fwNum >= 10.00 && fwNum <= 11.02) {
    window.location.replace("cachecss.html");
  } else if (fwNum >= 11.50 && fwNum <= 13.52) {
    window.location.replace("cacheslopkit.html");
  } else {
    setState('الفيرموير <span class="bad">' + fwVersion + '</span> غير مدعوم', "");
  }
}

function loadExploit() {
  if (forced === "lapse" || forced === "poops") {
    loadScript(forced === "lapse" ? "slopkit/chain_lapse.js" : "slopkit/chain_poops.js", true);
    return;
  }
  if (fwNum >= 5.05 && fwNum <= 5.07) {
    loadScript("505/exploit.js", false);
  } else if (fwNum >= 7.00 && fwNum <= 8.52) {
    loadScript("700/alert.js", true);
  } else if (fwNum >= 9.00 && fwNum <= 9.60) {
    loadScript("900/alert.js", true);
  } else if (fwNum >= 10.00 && fwNum <= 11.02) {
    loadScript("css/main.js", false, function () {
      setTimeout(function () { doJb(); }, 500);
    });
  } else if (fwNum >= 11.50 && fwNum <= 12.02) {
    loadScript("slopkit/chain_lapse.js", true);
  } else if (fwNum >= 12.50 && fwNum <= 13.00) {
    loadScript("slopkit/chain_poops.js", true);
  } else if (fwNum >= 13.02 && fwNum <= 13.52) {
    loadScript("slopkit/jb.js?v=10", true);
  } else {
    setState('الفيرموير <span class="bad">' + fwVersion + '</span> غير مدعوم', "");
  }
}

if (forced === "lapse" || forced === "poops") {
  var acF = window.applicationCache;
  if (!acF || acF.status === acF.IDLE || acF.status === acF.UPDATEREADY) {
    if (acF && acF.status === acF.UPDATEREADY) { try { acF.swapCache(); } catch (e) {} }
    loadExploit();
  } else if (acF.status === acF.UNCACHED || acF.status === acF.OBSOLETE) {
    redirectToCache();
  } else {
    setState("جاري تحميل الكاش...", "warn");
    acF.addEventListener("cached", function () { loadExploit(); }, false);
    acF.addEventListener("updateready", function () {
      try { acF.swapCache(); } catch (e) {}
      loadExploit();
    }, false);
    acF.addEventListener("error", function () {
      setState("خطأ في الكاش — جاري المحاولة...", "bad");
      setTimeout(loadExploit, 1000);
    }, false);
  }
} else if (!isPS4) {
  document.addEventListener("DOMContentLoaded", function () {
    setState("يتطلب PlayStation 4 — FW 5.05 و 6.72 حتى 13.52", "bad");
  });
} else if (fwNum >= 6.72 && fwNum < 7.00) {
  window.location.replace("../672/index.html");
} else {
  var ac = window.applicationCache;
  if (!ac) {
    redirectToCache();
  } else {
    var st = ac.status;
    if (st === 0 || st === 5) {
      redirectToCache();
    } else if (st === 1) {
      loadExploit();
    } else if (st === 2 || st === 3) {
      setState("جاري تحميل الكاش...", "warn");
      ac.addEventListener("progress", function (e) {
        if (e && e.total) {
          var p = Math.round((e.loaded / e.total) * 100);
          setState("جاري تحميل الكاش... " + p + "%", "warn");
          setProgress(p);
        }
      }, false);
      ac.addEventListener("cached", function () {
        setState("تم التخزين — جاري التشغيل...", "ok");
        setProgress(100);
        loadExploit();
      }, false);
      ac.addEventListener("updateready", function () {
        try { ac.swapCache(); } catch (e) {}
        loadExploit();
      }, false);
      ac.addEventListener("error", function () {
        setState("خطأ في الكاش — جاري المحاولة...", "bad");
        setTimeout(loadExploit, 1000);
      }, false);
    } else if (st === 4) {
      try { ac.swapCache(); } catch (e) {}
      loadExploit();
    } else {
      loadExploit();
    }
  }
}
</script>
</body>
</html>

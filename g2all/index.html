<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>alnafar | GoldHEN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden;background:#080b1a;color:#e2e8f0;font-family:'Noto Kufi Arabic','Chakra Petch','Segoe UI',system-ui,sans-serif}
    body{background:url('../background.png') no-repeat center center;background-size:cover;background-attachment:fixed;display:flex;flex-direction:column}
    #brand{flex:0 0 auto;text-align:center;padding:2.5vh 16px;background:rgba(8,11,26,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,212,255,.15)}
    #brand h1{font-size:clamp(24px,4.5vw,50px);font-weight:700;letter-spacing:.15em;color:#e2e8f0;margin:0;text-shadow:0 0 25px rgba(0,212,255,.4)}
    #brand h1 span{color:#00d4ff}
    #main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 20px;max-width:900px;width:100%;margin:0 auto}
    #msgs{font-size:clamp(28px,5vw,50px);font-weight:700;text-align:center;line-height:1.5;text-shadow:0.1em 0.1em 0.2em black;margin:0 0 3vh}
    .ok{color:#34d399}.bad{color:#f87171}.warn{color:#fbbf24}
    #logbox{width:100%;max-width:700px;padding:16px 20px;border:1px solid rgba(0,212,255,.15);border-radius:10px;background:rgba(8,11,26,.75);backdrop-filter:blur(6px);max-height:20vh;overflow-y:auto;font-size:clamp(14px,2.2vw,22px);font-family:'Chakra Petch',monospace;color:#9ca3af;line-height:1.7;margin-bottom:2vh}
    #logbox .ok{color:#34d399}#logbox .bad{color:#f87171}#logbox .warn{color:#fbbf24}#logbox .info{color:#60a5fa}
    .checkbox-wrap{margin-top:2vh;text-align:center}
    .checkbox-wrap label{font-size:clamp(14px,2.2vw,22px);color:#9ca3af;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
    .checkbox-wrap input[type="checkbox"]{width:clamp(18px,2.5vw,28px);height:clamp(18px,2.5vw,28px);accent-color:#00d4ff;cursor:pointer}
  </style>
</head>
<body>
  <div id="brand"><h1><span>al</span>nafar</h1></div>
  <div id="main">
    <h1 id="msgs">جاري الفحص...</h1>
    <div id="logbox"></div>
    <div class="checkbox-wrap">
      <label><input type="checkbox" id="autoRun" checked> تشغيل تلقائي</label>
    </div>
  </div>
  <script>
    (function(){
      'use strict';
      var msgsEl=document.getElementById('msgs');
      window.msgs=msgsEl;
      var logEl=document.getElementById('logbox');
      function logMsg(msg,type){logEl.innerHTML+='<span class="'+(type||'info')+'">'+msg+'</span>\n';logEl.scrollTop=logEl.scrollHeight}
      logMsg('[alnafar] g2all initialized','info');

      var autoRun=document.getElementById('autoRun');
      var saved=localStorage.getItem('alnafar_autorun');
      if(saved!==null) autoRun.checked=saved==='true';
      autoRun.addEventListener('change',function(){localStorage.setItem('alnafar_autorun',autoRun.checked)});

      var uaFull=navigator.userAgent;
      var match=uaFull.match(/PlayStation 4[ \/]([\d.]+)/i);
      var isPS4=match!==null;
      var fwVersion=isPS4?match[1]:'Unknown';
      var fwNum=parseFloat(fwVersion);

      if(!isPS4){
        msgsEl.innerHTML='<span class="bad">يتطلب PlayStation 4</span>';
        logMsg('[error] not a PS4','bad');
        return;
      }
      logMsg('[detect] firmware: '+fwVersion,'info');

      // Match original GamerHack logic exactly
      function loadExploit(src,type,cb){
        msgsEl.innerHTML='جاري تحميل GoldHEN v2.4b18.10... انتظر';
        msgsEl.className='warn';
        var s=document.createElement('script');
        s.src=src;if(type) s.type=type;
        s.onerror=function(){
          msgsEl.innerHTML='<span class="bad">محتوى غير موجود — امسح بيانات المتصفح وأعد تثبيت الكاش</span>';
          logMsg('[error] script not found: '+src,'bad');
        };
        if(cb) s.onload=cb;
        document.head.appendChild(s);
      }

      // Cache check — same as original GamerHack
      if(window.applicationCache.status=='0'){
        logMsg('[cache] not cached, redirecting...','info');
        if(fwNum>=7.00&&fwNum<=8.52){window.location.replace('cache700.html')}
        else if(fwNum>=9.00&&fwNum<=9.60){window.location.replace('cache900.html')}
        else if(fwNum>=10.00&&fwNum<=11.02){window.location.replace('cachecss.html')}
        else if(fwNum>=11.50&&fwNum<=13.00){window.location.replace('cacheslopkit.html')}
        else{
          msgsEl.innerHTML='<span class="bad">الفيرموير '+fwVersion+' غير مدعوم</span>';
          logMsg('[error] firmware not supported','bad');
        }
        return;
      }

      // Load exploit — same as original GamerHack
      logMsg('[cache] cached, loading exploit...','ok');
      if(fwNum>=7.00&&fwNum<=8.52){
        loadExploit('700/alert.js','module');
      }
      else if(fwNum>=9.00&&fwNum<=9.60){
        loadExploit('900/alert.js','module');
      }
      else if(fwNum>=10.00&&fwNum<=11.02){
        loadExploit('css/main.js','',function(){
          setTimeout(function(){doJb()},500);
        });
      }
      else if(fwNum>=11.50&&fwNum<=12.02){
        loadExploit('slopkit/chain_lapse.js','module');
      }
      else if(fwNum>=12.50&&fwNum<=13.00){
        loadExploit('slopkit/chain_poops.js','module');
      }
      else{
        msgsEl.innerHTML='<span class="bad">الفيرموير '+fwVersion+' غير مدعوم</span>';
        logMsg('[error] firmware not supported','bad');
      }
    })();
  </script>
</body>
</html>

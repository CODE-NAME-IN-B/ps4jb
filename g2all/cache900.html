<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alnafar | Cache 9.00-9.60</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');
var histlength=history.length;
history.go(-histlength);

function DLProgress(e){
  var p=Math.round(e.loaded/e.total*100);
  document.getElementById('msgs').innerHTML='جاري التحميل... '+p+'%';
}
function DisplayCacheProgress(){
  document.getElementById('msgs').innerHTML='تم التخزين بنجاح ✔';
  setTimeout(function(){document.getElementById('msgs').innerHTML='أغلق وأعد فتح المتصفح...';},1500);
}
window.applicationCache.addEventListener('progress',DLProgress,false);
window.applicationCache.oncached=function(){DisplayCacheProgress()};
window.applicationCache.onupdateready=function(){DisplayCacheProgress()};
window.applicationCache.onerror=function(){
  document.getElementById('msgs').innerHTML='خطأ في الكاش — امسح البيانات وأعد التثبيت';
};
</script>
<h1>alnafar</h1>
<hr><br>
<h1 id="msgs" style="color:#00ff00">جاري فحص الكاش...</h1>
<p>firmware 9.00-9.60</p>
</body>
</html>

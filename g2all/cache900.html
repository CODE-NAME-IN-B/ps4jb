<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="900.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alnafar | Cache 9.00-9.60</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="brand">
  <h1><span>al</span>nafar</h1>
  <small>PS4 Exploit Host</small>
</div>

<div id="main">
  <h1 id="msgs" role="status" aria-live="polite">جاري فحص الكاش...</h1>
  <div class="progress-wrap" id="progWrap"><div class="progress-fill" id="progFill"></div></div>
  <div class="fw-badge">firmware 9.00-9.60</div>
</div>

<div id="footer">
  <div class="store-name">الشاردة للإلكترونيات</div>
  <div class="store-addr">شارع القضائية مقابل مطحنة الفضيل — جوار معهد البيان — أجدابيا</div>
  <div class="store-phone">0920595447</div>
</div>

<script>
var msgsEl=document.getElementById('msgs');
var progWrap=document.getElementById('progWrap');
var progFill=document.getElementById('progFill');
var cacheDone=false;
var ac=window.applicationCache;

function showOk(text){
  if(cacheDone && text!=='تم التخزين بنجاح') return;
  cacheDone=true;
  msgsEl.innerHTML=text||'تم التخزين بنجاح';
  msgsEl.className='ok';
  progWrap.style.display='block';
  progFill.style.width='100%';
  setTimeout(function(){msgsEl.innerHTML='أغلق وأعد فتح المتصفح...';},2000);
}

function showFatal(msg){
  if(cacheDone) return;
  if(msgsEl.className==='bad') return;
  msgsEl.innerHTML=msg||'خطأ في الكاش — امسح البيانات وأعد التثبيت';
  msgsEl.className='bad';
  msgsEl.setAttribute('role','alert');
}

function showWait(){
  if(cacheDone) return;
  msgsEl.innerHTML='انتظر... جاري التخزين';
  msgsEl.className='warn';
}

function DLProgress(e){
  if(!e||!e.total||cacheDone) return;
  var p=Math.round(e.loaded/e.total*100);
  msgsEl.innerHTML='جاري التحميل... '+p+'%';
  msgsEl.className='warn';
  progWrap.style.display='block';
  progFill.style.width=p+'%';
}

function onCached(){
  try{ if(ac && ac.status===ac.UPDATEREADY) ac.swapCache(); }catch(e){}
  showOk('تم التخزين بنجاح');
}

function onError(){
  if(!ac || cacheDone) return;
  var st=ac.status;
  if(st===ac.IDLE){ showOk(); return; }
  if(st===ac.UPDATEREADY){ onCached(); return; }
  if(st===ac.DOWNLOADING || st===ac.CHECKING){ showWait(); return; }
  if(st===ac.UNCACHED || st===ac.OBSOLETE){ showFatal(); return; }
  showWait();
}

if(!ac){
  showFatal();
}else{
  ac.addEventListener('progress',DLProgress,false);
  ac.addEventListener('cached',onCached,false);
  ac.addEventListener('updateready',onCached,false);
  ac.addEventListener('noupdate',onCached,false);
  ac.addEventListener('error',onError,false);
  ac.addEventListener('obsolete',function(){ showFatal(); },false);
  if(ac.status===ac.IDLE) showOk();
  else if(ac.status===ac.UPDATEREADY) onCached();
  else if(ac.status===ac.UNCACHED || ac.status===ac.OBSOLETE) showFatal();
  else showWait();
}
</script>
</body>
</html>
